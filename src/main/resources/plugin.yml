name: SunshineCommandGuard
version: 2.0.0
main: com.sunshine.cmdguard.SunshineCommandGuard
api-version: '1.21'
folia-supported: true
author: Sunshine
description: Command visibility, access control and server privacy.
softdepend: [LuckPerms, PlaceholderAPI]
commands:
  cmdguard:
    description: Command guard administration (reload, refresh, test, debug, dump, generate, import, grant, ungrant, setup, diagnose, editor, apply).
    usage: /cmdguard <reload|refresh|test|debug|dump|generate|import|grant|ungrant|setup|diagnose|editor|apply>
    permission: sunshine.cmdguard.admin
permissions:
  sunshine.cmdguard.bypass:
    description: Bypasses all command filtering.
    default: op
  sunshine.cmdguard.admin:
    description: Allows use of /cmdguard.
    default: op
  sunshine.cmdguard.notify:
    description: Receives blocked-command staff notifications.
    default: op

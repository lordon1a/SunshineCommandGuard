# SunshineCommandGuard
# Review your groups and verify with /cmdguard test BEFORE enabling the filter.
# While `enabled` is false the plugin loads but changes nothing.
enabled: false

bypass-permission: "sunshine.cmdguard.bypass"

privacy:
  plugins-command:
    enabled: false
    message: "<red>Unknown command. Type <white>/help <red>for help."
    aliases: [plugins, pl, "bukkit:pl", "bukkit:plugins", ver, version, about, icanhasbukkit]
  help-command:
    enabled: false
    message: "<yellow>Type <white>/help <yellow>for a list of commands."
    aliases: ["?", "bukkit:help", "minecraft:help"]

groups:
  default:
    priority: 0
    blocked-message: "<red>Unknown command."
    commands:
      - help
      - spawn
      - msg
      - "regex:^(msg|tell|w|r|reply)$"
      - "!op"
      - "!stop"
    # hidden: runnable but not shown in tab-complete (put aliases here)
    hidden: []
    args: {}

  vip:
    priority: 10
    inherit: [default]
    commands: []
    hidden: []
    args: {}

  staff:
    priority: 50
    inherit: [vip]
    commands: []
    hidden: []
    args: {}

# SunshineCommandGuard
# Filtreyi acmadan once gruplari gozden gecirin ve /cmdguard test ile dogrulayin.
enabled: false

bypass-permission: "sunshine.cmdguard.bypass"

privacy:
  plugins-command:
    enabled: false
    message: "<gold>Sunshine Survival <grey>| <white>Sunucu bilgisi gizlidir."
    aliases: [plugins, pl, "bukkit:pl", "bukkit:plugins", ver, version, about, icanhasbukkit]
  help-command:
    enabled: false
    message: "<yellow>Komutlar icin <white>/rehber <yellow>yazabilirsin."
    aliases: [help, "?", "bukkit:help", "minecraft:help"]

groups:
  default:
    priority: 0
    blocked-message: "<red>Bilinmeyen komut. <grey>Yardim icin <white>/rehber"
    commands:
      - menu
      - seviye
      - rehber
      - harita
      - gelisim
      - borsa
      - market
      - rtp
      - "regex:^(msg|tell|w|r|reply)$"
      - "!op"
      - "!stop"
    # hidden: visible degil ama calisabilir komutlar (aliaslar buraya).
    hidden: []
    args: {}

  vip:
    priority: 10
    inherit: [default]
    commands: []
    hidden: []
    args: {}

  staff:
    priority: 50
    inherit: [vip]
    commands: []
    hidden: []
    args: {}

# SunshineCommandGuard
# Review your groups and verify with /cmdguard test BEFORE enabling the filter.
# While `enabled` is false the plugin loads but changes nothing.
enabled: false

bypass-permission: "sunshine.cmdguard.bypass"

# permission-sync: also require each command's own Bukkit permission node.
# A command is hidden/blocked unless the group allows it AND the player holds
# the permission the owning plugin registered for it. Commands with no known
# permission fall back to the group lists only. Default off.
permission-sync: false

# monitoring: what happens when a command is blocked. All optional.
monitoring:
  log-blocked: false
  notify-staff: false
  notify-permission: "sunshine.cmdguard.notify"
  notify-cooldown-seconds: 5

# update notifications: notify-only GitHub Releases check.
# Nothing is ever downloaded or installed. Setting enabled: false
# disables the external request entirely.
updates:
  enabled: true
  notify-console: true
  notify-admins: true

privacy:
  plugins-command:
    enabled: false
    message: "<red>Unknown command. Type <white>/help <red>for help."
    aliases: [plugins, pl, "bukkit:pl", "bukkit:plugins", ver, version, about, icanhasbukkit]
  help-command:
    enabled: false
    message: "<yellow>Type <white>/help <yellow>for a list of commands."
    aliases: ["?", "bukkit:help", "minecraft:help"]

# Anti-enumeration protects against clients that scan namespaced commands or
# request /version completions directly, even when those roots are hidden.
# This section is active only while the top-level filter is enabled.
anti-enumeration:
  enabled: true
  hide-namespaced-commands: true
  block-namespaced-execution: true
  block-completion-probes: true
  # Add a namespace only when players genuinely need its namespaced label.
  namespace-allowlist: []

groups:
  default:
    priority: 0
    blocked-message: "<red>Unknown command."
    commands:
      - help
      - spawn
      - msg
      - "regex:^(msg|tell|w|r|reply)$"
      - "!op"
      - "!stop"
    # hidden: runnable but not shown in tab-complete (put aliases here)
    hidden: []
    args: {}
    # worlds: restrict this group to these worlds (empty = all worlds).
    worlds: []

  vip:
    priority: 10
    inherit: [default]
    commands: []
    hidden: []
    args: {}
    worlds: []

  staff:
    priority: 50
    inherit: [vip]
    commands: []
    hidden: []
    args: {}
    worlds: []
